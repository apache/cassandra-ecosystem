# CircleCI CONTINUATION config (dispatched by .circleci/config.yml).
#
# Carries both projects' original CircleCI jobs, adapted for the subdir layout:
#   - gradle/script `run` steps set `working_directory: analytics|sidecar`
#   - persist_to_workspace / attach_workspace / store_* paths (which do NOT honor
#     working_directory) are explicitly prefixed with the subdir
# Each project's workflow is gated on its pipeline parameter, so only the changed
# project runs. Sidecar keeps its manual `approve-build` cost-control gate.
#
# NOTE: this config is only exercised once CircleCI dynamic config is enabled (INFRA).
# The subdir path adaptations below should be confirmed on the first live run — in
# particular the workspace roots and the gradle cache-key file location.

version: 2.1

parameters:
  run-analytics:
    type: boolean
    default: false
  run-sidecar:
    type: boolean
    default: false

commands:
  install_common:
    steps:
      - run: sudo apt-get update
      - run: |
          if [ -f /etc/ssl/certs/java/cacerts/cacerts ]; then
              sudo mv /etc/ssl/certs/java/cacerts/ /etc/ssl/certs/java/cacerts-old
              sudo mv /etc/ssl/certs/java/cacerts-old/cacerts /etc/ssl/certs/java/
              sudo rmdir /etc/ssl/certs/java/cacerts-old
          fi
      - run: |
          apt-get download ant ant-optional
          sudo dpkg --force-all -i ant*.deb
          rm ant*.deb
      - run: |
          sudo bash -c 'for i in {2..20}; do echo 127.0.0.${i} localhost${i} >> /etc/hosts; done'
          cat /etc/hosts

  # ---- analytics reusable commands (run inside analytics/) ----
  run_build:
    parameters:
      spark: { type: string }
      scala: { type: string }
      jdk: { type: string }
      sstable_format: { type: string, default: "big" }
      cassandra: { type: string, default: "" }
    steps:
      - run:
          working_directory: analytics
          environment:
            SPARK_VERSION: "<<parameters.spark>>"
            SCALA_VERSION: "<<parameters.scala>>"
            JDK_VERSION: "<<parameters.jdk>>"
            INTEGRATION_MAX_PARALLEL_FORKS: 1
            INTEGRATION_MAX_HEAP_SIZE: "3072m"
            CORE_MAX_PARALLEL_FORKS: 3
            CORE_TEST_MAX_HEAP_SIZE: "2048m"
            CASSANDRA_VERSION: "<<parameters.cassandra>>"
          command: |
            export GRADLE_OPTS="-Xmx2g -Dorg.gradle.jvmargs=-Xmx2g"
            ./gradlew --no-daemon --max-workers=2 --stacktrace clean assemble check -x cassandra-analytics-integration-tests:test -Dcassandra.analytics.bridges.sstable_format=<<parameters.sstable_format>>

  run_integration:
    parameters:
      spark: { type: string }
      scala: { type: string }
      jdk: { type: string }
      cassandra: { type: string }
    steps:
      - run:
          working_directory: analytics
          environment:
            SPARK_VERSION: "<<parameters.spark>>"
            SCALA_VERSION: "<<parameters.scala>>"
            JDK_VERSION: "<<parameters.jdk>>"
            INTEGRATION_MAX_PARALLEL_FORKS: 1
            INTEGRATION_MAX_HEAP_SIZE: "3072M"
          command: |
            export GRADLE_OPTS="-Xmx2g -Dorg.gradle.jvmargs=-Xmx2g"
            export DTEST_JAR="dtest-<< parameters.cassandra >>.jar"
            export CASSANDRA_VERSION=$(echo << parameters.cassandra >> | cut -d'.' -f 1,2)
            ./gradlew --no-daemon --max-workers=2 --stacktrace clean assemble
            cd cassandra-analytics-integration-tests/src/test/java
            CLASSNAMES=$(circleci tests glob "**/*Test.java" \
            | cut -c 1- | sed 's@/@.@g' \
            | sed 's/.\{5\}$//' \
            | circleci tests split --split-by=timings --timings-type=classname)
            cd ../../../..
            echo "CircleCI assigned the following classes for testing: $CLASSNAMES"
            SRC_REPORT_DIR="$(pwd)/build/test-results/cassandra-analytics-integration-tests/test"
            HTML_REPORT_DIR="$(pwd)/build/reports/tests/cassandra-analytics-integration-tests/test"
            AGG_ROOT="$(pwd)/build/aggregated-test-reports/integration"
            mkdir -p "$AGG_ROOT"
            EXIT_STATUS=0
            for TEST_NAME in $CLASSNAMES; do
                ./gradlew --stacktrace cassandra-analytics-integration-tests:test --tests $TEST_NAME --no-daemon || EXIT_STATUS=$?;
                DEST="$AGG_ROOT/$TEST_NAME"
                mkdir -p "$DEST"
                MOVED=0
                if [ -d "$SRC_REPORT_DIR" ]; then
                    for f in "$SRC_REPORT_DIR"/TEST-*.xml; do
                        [ -e "$f" ] || continue
                        mv "$f" "$DEST"/
                        MOVED=1
                    done
                fi
                if [ -d "$HTML_REPORT_DIR" ]; then
                    mkdir -p "$DEST/html"
                    cp -r "$HTML_REPORT_DIR/." "$DEST/html/"
                fi
                if [ "$MOVED" = "0" ]; then
                    MSG="Gradle produced no JUnit XML for $TEST_NAME; likely a class-level crash before tests ran. Exit status: $EXIT_STATUS. See job artifacts for full logs."
                    {
                      printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
                      printf '<testsuite name="%s" tests="1" failures="1" errors="0" skipped="0">\n' "$TEST_NAME"
                      printf '  <testcase classname="%s" name="noJUnitReportProduced">\n' "$TEST_NAME"
                      printf '    <failure message="%s">%s</failure>\n' "$MSG" "$MSG"
                      printf '  </testcase>\n'
                      printf '</testsuite>\n'
                    } > "$DEST/TEST-${TEST_NAME}.xml"
                fi
            done;
            exit $EXIT_STATUS
          no_output_timeout: 30m

  # ---- sidecar reusable commands (scoped to sidecar/) ----
  restore_gradle_cache:
    steps:
      - run:
          name: Compute Gradle cache key
          command: |
            { find sidecar -type f \( -name 'build.gradle' -o -name 'settings.gradle' -o -name 'gradle.properties' \) -not -path '*/build/*' -not -path 'sidecar/.gradle/*' | sort | xargs sha256sum;
              sha256sum sidecar/gradle/wrapper/gradle-wrapper.properties; } > .gradle-cache-key
            cat .gradle-cache-key
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum ".gradle-cache-key" }}
            - gradle-v1-
  save_gradle_cache:
    steps:
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-v1-{{ checksum ".gradle-cache-key" }}

jobs:
  # ================= ANALYTICS =================
  analytics-build-deps-jdk11:
    docker:
      - image: cimg/openjdk:11.0
    resource_class: large
    steps:
      - install_common
      - checkout
      - run:
          name: Build dependencies for JDK11 builds
          working_directory: analytics
          environment:
            CASSANDRA_USE_JDK11: "true"
            JDK_VERSION: "11"
            SPARK_VERSION: "3"
            SCALA_VERSION: "2.12"
          command: |
            ./scripts/build-dependencies.sh
            ./gradlew --no-daemon --max-workers=2 codeCheckTasks
      - persist_to_workspace:
          root: analytics/dependencies
          paths:
            - "*.jar"
            - "org/**/*"

  analytics-build-deps-jdk17:
    docker:
      - image: cimg/openjdk:17.0
    resource_class: large
    steps:
      - install_common
      - checkout
      - run:
          name: Build dependencies for JDK17 builds
          working_directory: analytics
          environment:
            JDK_VERSION: "17"
            SPARK_VERSION: "4"
            SCALA_VERSION: "2.13"
            BRANCHES: "cassandra-5.0"
          command: |
            ./scripts/build-dependencies.sh
            ./gradlew --no-daemon --max-workers=2 codeCheckTasks
      - persist_to_workspace:
          root: analytics/dependencies
          paths:
            - "*.jar"
            - "org/**/*"

  analytics-unit:
    parameters:
      spark: { type: string }
      scala: { type: string }
      jdk: { type: string }
      cassandra: { type: string }
      sstable_format: { type: string }
    docker:
      - image: cimg/openjdk:<<parameters.jdk>>.0
    resource_class: large
    steps:
      - install_common
      - checkout
      - attach_workspace:
          at: analytics/dependencies
      - run_build:
          spark: "<<parameters.spark>>"
          scala: "<<parameters.scala>>"
          jdk: "<<parameters.jdk>>"
          sstable_format: "<<parameters.sstable_format>>"
          cassandra: "<<parameters.cassandra>>"
      - store_artifacts:
          when: always
          path: analytics/build/test-results
          destination: test-results
      - store_artifacts:
          when: always
          path: analytics/build/reports
          destination: reports
      - store_test_results:
          when: always
          path: analytics/build/test-results

  analytics-int-test:
    parameters:
      spark: { type: string }
      scala: { type: string }
      jdk: { type: string }
      cassandra: { type: string }
    parallelism: 8
    docker:
      - image: cimg/openjdk:<<parameters.jdk>>.0
    resource_class: large
    steps:
      - setup_remote_docker
      - install_common
      - checkout
      - attach_workspace:
          at: analytics/dependencies
      - run_integration:
          spark: "<<parameters.spark>>"
          scala: "<<parameters.scala>>"
          jdk: "<<parameters.jdk>>"
          cassandra: "<<parameters.cassandra>>"
      - store_artifacts:
          when: always
          path: analytics/build/aggregated-test-reports
          destination: test-results
      - store_artifacts:
          when: always
          path: analytics/build/reports
          destination: reports
      - store_artifacts:
          when: always
          path: analytics/cassandra-analytics-integration-tests
          destination: int-tests-misc
      - store_test_results:
          when: always
          path: analytics/build/aggregated-test-reports

  # ================= SIDECAR =================
  sidecar-client-only-unit-java8:
    docker:
      - image: cimg/openjdk:8.0
    steps:
      - install_common
      - setup_remote_docker
      - checkout
      - run:
          working_directory: sidecar
          command: ./gradlew build --stacktrace
      - store_artifacts:
          path: sidecar/build/reports
          destination: test-reports
      - store_artifacts:
          path: sidecar/build/test-results/
          destination: test-results
      - store_test_results:
          path: sidecar/build/test-results/

  sidecar-unit-java11:
    docker:
      - image: cimg/openjdk:11.0
    resource_class: large
    steps:
      - setup_remote_docker
      - install_common
      - checkout
      - restore_gradle_cache
      - attach_workspace:
          at: sidecar/dtest-jars
      - run:
          working_directory: sidecar
          command: ./gradlew build -x integrationTest --stacktrace
      - save_gradle_cache
      - store_artifacts:
          path: sidecar/build/reports
          destination: test-reports
      - store_artifacts:
          path: sidecar/build/test-results/
          destination: test-results
      - store_test_results:
          path: sidecar/build/test-results/

  sidecar-build-dtest-jdk11:
    docker:
      - image: cimg/openjdk:11.0
    resource_class: large
    steps:
      - install_common
      - checkout
      - run:
          name: Build jvm dtest jars with jdk11
          working_directory: sidecar
          command: |
            scripts/build-dtest-jars.sh
      - persist_to_workspace:
          root: sidecar/dtest-jars
          paths:
            - "*.jar"
      - persist_to_workspace:
          root: sidecar/cassandra-tarballs
          paths:
            - "*.tar.gz"

  sidecar-integration-cassandra-40-java11:
    docker:
      - image: cimg/openjdk:11.0
    environment:
      INTEGRATION_MAX_PARALLEL_FORKS: 2
      INTEGRATION_MAX_HEAP_SIZE: "2000M"
    resource_class: large
    steps:
      - install_common
      - checkout
      - restore_gradle_cache
      - attach_workspace:
          at: sidecar/dtest-jars
      - run:
          working_directory: sidecar
          command: ./scripts/install-shaded-dtest-jar-local.sh
      - run:
          working_directory: sidecar
          command: ./gradlew --no-daemon --max-workers=2 -PdtestVersion=4.0.16 -Dcassandra.sidecar.versions_to_test="4.0" checkstyleIntegrationTest integrationTestLightWeight --stacktrace
      - save_gradle_cache
      - store_artifacts:
          path: sidecar/build/reports
          destination: test-reports
      - store_artifacts:
          path: sidecar/build/test-results/
          destination: test-results
      - store_test_results:
          path: sidecar/build/test-results/

  sidecar-integration-heavy-cassandra-40-java11:
    docker:
      - image: cimg/openjdk:11.0
    environment:
      INTEGRATION_MAX_PARALLEL_FORKS: 3
      INTEGRATION_MAX_HEAP_SIZE: "3600M"
    resource_class: large
    steps:
      - install_common
      - setup_remote_docker
      - checkout
      - restore_gradle_cache
      - attach_workspace:
          at: sidecar/dtest-jars
      - attach_workspace:
          at: sidecar/cassandra-tarballs
      - run:
          working_directory: sidecar
          command: ./scripts/install-shaded-dtest-jar-local.sh
      - run:
          working_directory: sidecar
          command: ./gradlew --no-daemon -PdtestVersion=4.0.16 -PtarballVersion=4.0 -Dcassandra.sidecar.versions_to_test="4.0" jar integrationTestHeavyWeight --stacktrace
      - save_gradle_cache
      - store_artifacts:
          path: sidecar/build/reports
          destination: test-reports
      - store_artifacts:
          path: sidecar/build/test-results/
          destination: test-results
      - store_test_results:
          path: sidecar/build/test-results/

  sidecar-integration-cassandra-50-java11:
    docker:
      - image: cimg/openjdk:11.0
    environment:
      INTEGRATION_MAX_PARALLEL_FORKS: 2
      INTEGRATION_MAX_HEAP_SIZE: "2000M"
    resource_class: large
    steps:
      - install_common
      - checkout
      - restore_gradle_cache
      - attach_workspace:
          at: sidecar/dtest-jars
      - run:
          working_directory: sidecar
          command: ./scripts/install-shaded-dtest-jar-local.sh
      - run:
          working_directory: sidecar
          command: ./gradlew --no-daemon --max-workers=2 -PdtestVersion=5.0.3 -Dcassandra.sidecar.versions_to_test="5.0" checkstyleIntegrationTest integrationTestLightWeight --stacktrace
      - save_gradle_cache
      - store_artifacts:
          path: sidecar/build/reports
          destination: test-reports
      - store_artifacts:
          path: sidecar/build/test-results/
          destination: test-results
      - store_test_results:
          path: sidecar/build/test-results/

  sidecar-integration-heavy-cassandra-50-java11:
    docker:
      - image: cimg/openjdk:11.0
    environment:
      INTEGRATION_MAX_PARALLEL_FORKS: 3
      INTEGRATION_MAX_HEAP_SIZE: "3600M"
    resource_class: large
    steps:
      - install_common
      - setup_remote_docker
      - checkout
      - restore_gradle_cache
      - attach_workspace:
          at: sidecar/dtest-jars
      - attach_workspace:
          at: sidecar/cassandra-tarballs
      - run:
          working_directory: sidecar
          command: ./scripts/install-shaded-dtest-jar-local.sh
      - run:
          working_directory: sidecar
          command: ./gradlew --no-daemon -PdtestVersion=5.0.3 -PtarballVersion=5.0 -Dcassandra.sidecar.versions_to_test="5.0" jar integrationTestHeavyWeight --stacktrace
      - save_gradle_cache
      - store_artifacts:
          path: sidecar/build/reports
          destination: test-reports
      - store_artifacts:
          path: sidecar/build/test-results/
          destination: test-results
      - store_test_results:
          path: sidecar/build/test-results/

  sidecar-integration-cassandra-trunk-java11:
    docker:
      - image: cimg/openjdk:11.0
    environment:
      INTEGRATION_MAX_PARALLEL_FORKS: 2
      INTEGRATION_MAX_HEAP_SIZE: "2000M"
    resource_class: large
    steps:
      - install_common
      - checkout
      - restore_gradle_cache
      - attach_workspace:
          at: sidecar/dtest-jars
      - run:
          working_directory: sidecar
          command: ./scripts/install-shaded-dtest-jar-local.sh
      - run:
          working_directory: sidecar
          command: ./gradlew --no-daemon --max-workers=2 -PdtestVersion=5.1 -Dcassandra.sidecar.versions_to_test="5.1" checkstyleIntegrationTest spotbugsIntegrationTest integrationTestLightWeight --stacktrace
      - save_gradle_cache
      - store_artifacts:
          path: sidecar/build/reports
          destination: test-reports
      - store_artifacts:
          path: sidecar/build/test-results/
          destination: test-results
      - store_test_results:
          path: sidecar/build/test-results/

  sidecar-integration-heavy-cassandra-trunk-java11:
    docker:
      - image: cimg/openjdk:11.0
    environment:
      INTEGRATION_MAX_PARALLEL_FORKS: 3
      INTEGRATION_MAX_HEAP_SIZE: "3600M"
    resource_class: large
    steps:
      - install_common
      - setup_remote_docker
      - checkout
      - restore_gradle_cache
      - attach_workspace:
          at: sidecar/dtest-jars
      - attach_workspace:
          at: sidecar/cassandra-tarballs
      - run:
          working_directory: sidecar
          command: ./scripts/install-shaded-dtest-jar-local.sh
      - run:
          working_directory: sidecar
          command: ./gradlew --no-daemon -PdtestVersion=5.1 -PtarballVersion=5.1 -Dcassandra.sidecar.versions_to_test="5.1" jar integrationTestHeavyWeight --stacktrace
      - save_gradle_cache
      - store_artifacts:
          path: sidecar/build/reports
          destination: test-reports
      - store_artifacts:
          path: sidecar/build/test-results/
          destination: test-results
      - store_test_results:
          path: sidecar/build/test-results/

  sidecar-deb-build-install:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - install_common
      - checkout
      - restore_gradle_cache
      - run: sudo apt --fix-broken install
      - run:
          name: Build DEB
          working_directory: sidecar
          command: |
            ./gradlew --parallel clean buildDeb \
              -x test -x integrationTest \
              -x rat \
              -x checkstyleMain -x checkstyleTest -x checkstyleTestFixtures \
              -x spotbugsMain -x spotbugsTest \
              -x javadoc \
              -x asciidoctor -x copyDocs
      - run:
          working_directory: sidecar
          command: DEBIAN_FRONTEND=noninteractive sudo apt install -y ./build/distributions/apache-cassandra-sidecar*.deb
      - run: test -f /opt/apache-cassandra-sidecar/bin/cassandra-sidecar
      - run: test -f /opt/apache-cassandra-sidecar/conf/sidecar.yaml
      - run: test -f /opt/apache-cassandra-sidecar/conf/logback.xml
      - run: test -f /opt/apache-cassandra-sidecar/LICENSE.txt
      - run: test -f /opt/apache-cassandra-sidecar/lib/cassandra-sidecar-*.jar
      - run:
          name: Verify DEB package version
          working_directory: sidecar
          command: |
            EXPECTED_UPSTREAM=$(grep "^version=" gradle.properties | cut -d'=' -f2 | tr '-' '~')
            ACTUAL_VERSION=$(dpkg-query -W -f='${Version}' apache-cassandra-sidecar)
            ACTUAL_UPSTREAM="${ACTUAL_VERSION%-*}"
            ACTUAL_REVISION="${ACTUAL_VERSION##*-}"
            echo "DEB: upstream=${ACTUAL_UPSTREAM}, revision=${ACTUAL_REVISION}, expected upstream=${EXPECTED_UPSTREAM}"
            if [ -z "${ACTUAL_REVISION}" ] || [ "${ACTUAL_REVISION}" = "${ACTUAL_VERSION}" ]; then
              echo "DEB has no Debian revision — yields trailing '-' style bug"
              exit 1
            fi
            if [ "${ACTUAL_UPSTREAM}" != "${EXPECTED_UPSTREAM}" ]; then
              echo "DEB upstream version mismatch: expected '${EXPECTED_UPSTREAM}', got '${ACTUAL_UPSTREAM}'"
              exit 1
            fi

  sidecar-rpm-build-install:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - run: sudo apt-get update && sudo apt-get install -y dnf rpm
      - checkout
      - restore_gradle_cache
      - run:
          name: Build RPM
          working_directory: sidecar
          command: |
            ./gradlew --parallel buildRpm \
              -x test -x integrationTest \
              -x rat \
              -x checkstyleMain -x checkstyleTest -x checkstyleTestFixtures \
              -x spotbugsMain -x spotbugsTest \
              -x javadoc \
              -x asciidoctor -x copyDocs
      - run:
          working_directory: sidecar
          command: sudo dnf install -y ./build/distributions/apache-cassandra-sidecar*.rpm
      - run: test -f /opt/apache-cassandra-sidecar/bin/cassandra-sidecar
      - run: test -f /opt/apache-cassandra-sidecar/conf/sidecar.yaml
      - run: test -f /opt/apache-cassandra-sidecar/conf/logback.xml
      - run: test -f /opt/apache-cassandra-sidecar/LICENSE.txt
      - run: test -f /opt/apache-cassandra-sidecar/lib/cassandra-sidecar-*.jar
      - run:
          name: Verify RPM package version
          working_directory: sidecar
          command: |
            EXPECTED_VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2 | tr '-' '~')
            RPM_FILE=$(ls build/distributions/apache-cassandra-sidecar*.rpm | head -n1)
            ACTUAL_VERSION=$(rpm -qp --queryformat '%{VERSION}' "${RPM_FILE}")
            ACTUAL_RELEASE=$(rpm -qp --queryformat '%{RELEASE}' "${RPM_FILE}")
            echo "RPM: version=${ACTUAL_VERSION}, release=${ACTUAL_RELEASE}, expected=${EXPECTED_VERSION}"
            if [ -z "${ACTUAL_RELEASE}" ] || [ "${ACTUAL_RELEASE}" = "(none)" ]; then
              echo "RPM Release is empty — yields trailing '-' in 'yum list'"
              exit 1
            fi
            if [ "${ACTUAL_VERSION}" != "${EXPECTED_VERSION}" ]; then
              echo "RPM Version mismatch: expected '${EXPECTED_VERSION}', got '${ACTUAL_VERSION}'"
              exit 1
            fi

  sidecar-docker-build:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - setup_remote_docker
      - checkout
      - run:
          working_directory: sidecar
          command: ./gradlew --info clean :server:jibDockerBuild

  sidecar-docs-build:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - install_common
      - checkout
      - run:
          working_directory: sidecar
          command: ./gradlew docs:asciidoctor
      - run: test -f sidecar/docs/build/user.html
      - run: test -f sidecar/docs/build/development.html

workflows:
  version: 2

  analytics-build-and-test:
    when: << pipeline.parameters.run-analytics >>
    jobs:
      - analytics-build-deps-jdk11
      - analytics-build-deps-jdk17
      - analytics-unit:
          requires: [analytics-build-deps-jdk11]
          matrix:
            alias: analytics-unit-c4x
            parameters:
              spark: ["3"]
              scala: ["2.12"]
              jdk: ["11"]
              sstable_format: ["big"]
              cassandra: ["4.0", "4.1"]
      - analytics-unit:
          requires: [analytics-build-deps-jdk11]
          matrix:
            alias: analytics-unit-c5
            parameters:
              spark: ["3"]
              scala: ["2.13"]
              jdk: ["11"]
              sstable_format: ["bti"]
              cassandra: ["5.0"]
      - analytics-unit:
          requires: [analytics-build-deps-jdk17]
          matrix:
            alias: analytics-unit-c5-spark4
            parameters:
              spark: ["4"]
              scala: ["2.13"]
              jdk: ["17"]
              sstable_format: ["bti"]
              cassandra: ["5.0"]
      - analytics-int-test:
          requires: [analytics-build-deps-jdk11]
          matrix:
            alias: analytics-int-c4x
            parameters:
              spark: ["3"]
              scala: ["2.12"]
              jdk: ["11"]
              cassandra: ["4.0.17", "4.1.4"]
