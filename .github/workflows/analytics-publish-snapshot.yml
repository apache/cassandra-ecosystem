# Publishes an Analytics SNAPSHOT build to the ASF Nexus snapshot repository
# (repository.apache.org). Optional and manual: nothing publishes unless a committer
# starts it from the Actions tab ("Run workflow"), choosing the branch to publish.
#
# CREDENTIALS: publishing needs ASF Nexus deploy credentials in the NEXUS_USER and
# NEXUS_PW repository secrets, which ASF INFRA must provision for this repo. Without
# them, scripts/publish-snapshot.sh stops before publishing ("MAVEN_USERNAME and
# MAVEN_PASSWORD must both be set").
#
# Carried over from the standalone analytics repo (CASSANALYTICS-198), scoped for the
# merged ecosystem:
#   - manual workflow_dispatch only; upstream also published after every successful
#     trunk run of its CI workflow
#   - all gradle/script commands run in the analytics/ subtree (defaults.working-directory)
#   - workspace cache restores use analytics-ci.yml's analytics/ path and
#     analytics-build-jdkN-<sha> keys, so a commit Analytics CI already built skips the
#     dependency build

name: Analytics Publish Snapshot

on:
  workflow_dispatch:

# If it is started again for the same branch while a publish is in progress,
# cancel the stale publish in favor of the latest.
concurrency:
  group: analytics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: analytics

jobs:
  publish-common:
    name: Publish snapshot (common artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 11
      - name: Cache Maven repository
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2
          key: maven-repo-jdk11-${{ github.sha }}
      - name: Cache workspace
        id: cache-build-restore
        uses: actions/cache/restore@v4
        with:
          path: analytics
          key: analytics-build-jdk11-${{ github.sha }}
      - name: Build dependencies (cache miss fallback)
        if: steps.cache-build-restore.outputs.cache-hit != 'true'
        run: |
          sudo bash -c 'for i in {2..20}; do echo 127.0.0.${i} localhost${i} >> /etc/hosts; done'
          for i in {2..20}
          do
            sudo ip addr add "127.0.0.${i}" dev lo
            sudo route add -host "127.0.0.${i}" dev lo;
          done

          export JDK_VERSION="11"
          export SPARK_VERSION="3"
          export SCALA_VERSION="2.12"
          export CASSANDRA_USE_JDK11="true"

          ./scripts/build-dependencies.sh
      - name: Publish common artifacts
        env:
          ARTIFACT_TYPE: common
          SCALA_VERSION: "2.13"
          SPARK_VERSION: "3"
          JDK_VERSION: "11"
          MAVEN_USERNAME: ${{ secrets.NEXUS_USER }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PW }}
        run: ./scripts/publish-snapshot.sh

  publish-spark:
    name: Publish snapshot (spark artifacts) - Scala ${{ matrix.scala }} Spark${{ matrix.spark }} JDK${{ matrix.jdk }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - scala: '2.12'
            spark: '3'
            jdk: '11'
          - scala: '2.13'
            spark: '3'
            jdk: '11'
          - scala: '2.13'
            spark: '4'
            jdk: '17'
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdk }}
      - name: Cache Maven repository
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2
          key: maven-repo-jdk${{ matrix.jdk }}-${{ github.sha }}
      - name: Cache workspace
        id: cache-build-restore
        uses: actions/cache/restore@v4
        with:
          path: analytics
          key: analytics-build-jdk${{ matrix.jdk }}-${{ github.sha }}
      - name: Build dependencies (cache miss fallback)
        if: steps.cache-build-restore.outputs.cache-hit != 'true'
        run: |
          sudo bash -c 'for i in {2..20}; do echo 127.0.0.${i} localhost${i} >> /etc/hosts; done'
          for i in {2..20}
          do
            sudo ip addr add "127.0.0.${i}" dev lo
            sudo route add -host "127.0.0.${i}" dev lo;
          done

          export JDK_VERSION="${{ matrix.jdk }}"
          export SPARK_VERSION="${{ matrix.spark }}"
          export SCALA_VERSION="${{ matrix.scala }}"
          if [ "${{ matrix.jdk }}" = "11" ]; then
            export CASSANDRA_USE_JDK11=true
          fi
          if [ "${{ matrix.jdk }}" = "17" ]; then
            # JDK17 leg only targets Cassandra 5.0+; skip 4.0 / 4.1 dtest jar builds.
            export BRANCHES="cassandra-5.0"
          fi

          ./scripts/build-dependencies.sh
      - name: Publish spark artifacts
        env:
          ARTIFACT_TYPE: spark
          SCALA_VERSION: ${{ matrix.scala }}
          SPARK_VERSION: ${{ matrix.spark }}
          JDK_VERSION: ${{ matrix.jdk }}
          MAVEN_USERNAME: ${{ secrets.NEXUS_USER }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PW }}
        run: ./scripts/publish-snapshot.sh
