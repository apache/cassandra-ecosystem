# Verifies every `uses:` ref in .github/ is on the ASF Infra allowlist
# (apache/infrastructure-actions/approved_patterns.yml).
#
# Why this exists: an action that is NOT allowlisted does not fail loudly. The job dies
# at startup with no logs and no notification, and the PR can look green because no
# checks ran (apache/infrastructure-actions#574). This workflow turns that silent
# failure into a normal red check with a filename and the offending ref.
#
# The two ways to trip it:
#   1. Using an action that is not on the allowlist at all.
#   2. Referencing an allowlisted action by TAG when the allowlist pins it to SHAs.
#      `dorny/paths-filter@v3` is a violation even though paths-filter is approved,
#      because only specific SHAs are approved. Entries recorded as '*' (e.g.
#      mikepenz/action-junit-report, softprops/action-gh-release) accept any ref.
#
# Approved SHA pins also expire once a newer version is approved, so this check doubles
# as the early warning for a pin that is about to be removed from the allowlist.
#
# apache/* is implicitly trusted, so the checker itself needs no allowlist entry.

name: ASF Allowlist Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches:
      - trunk
    paths:
      - ".github/**"

permissions:
  contents: read

jobs:
  asf-allowlist-check:
    name: ASF allowlist check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: apache/infrastructure-actions/allowlist-check@main
