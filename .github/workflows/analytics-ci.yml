# Analytics CI for the merged cassandra-ecosystem repo.
#
# This workflow ALWAYS triggers, but the heavy jobs only run when analytics/**
# (or this workflow) changed — detected by the `changes` job. Running always +
# skipping heavy jobs internally (rather than gating via `on.<event>.paths`, which
# skips the workflow wholesale) keeps every job's status visible on the PR while
# still spending compute only on the changed project.
#
# There is deliberately NO aggregator "gate" job and NO required status check, which
# matches upstream cassandra-analytics and cassandra-sidecar: neither declared any
# required contexts in .asf.yaml. Merge readiness is a committer judgement call made
# by reading the checks list, not a programmatic forcing function.
#
# All build/test commands are the analytics repo's originals, unchanged, run via
# `defaults.run.working-directory: analytics`. Only non-`run` action paths (artifact
# uploads, workspace cache) carry an explicit `analytics/` prefix, since
# working-directory does not affect `uses:` steps.

name: Analytics CI

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]
  workflow_dispatch:

concurrency:
  group: analytics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: analytics

jobs:
  changes:
    name: Detect analytics changes
    runs-on: ubuntu-latest
    outputs:
      analytics: ${{ steps.filter.outputs.analytics }}
    steps:
      - uses: actions/checkout@v4
      # Third-party actions must be pinned to a SHA on the ASF allowlist
      # (apache/infrastructure-actions/approved_patterns.yml); a bare tag like @v3
      # matches no allowlist entry and makes the job fail at startup with no logs.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            analytics:
              - 'analytics/**'
              - '.github/workflows/analytics-ci.yml'

  build-jdk11:
    name: Compile and build (JDK 11)
    needs: changes
    if: ${{ needs.changes.outputs.analytics == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 11
      - run: |
          sudo apt-get update

          if [ -f /etc/ssl/certs/java/cacerts/cacerts ]; then
              sudo mv /etc/ssl/certs/java/cacerts/ /etc/ssl/certs/java/cacerts-old
              sudo mv /etc/ssl/certs/java/cacerts-old/cacerts /etc/ssl/certs/java/
              sudo rmdir /etc/ssl/certs/java/cacerts-old
          fi

          apt-get download ant ant-optional
          sudo dpkg --force-all -i ant*.deb
          rm ant*.deb

          sudo bash -c 'for i in {2..20}; do echo 127.0.0.${i} localhost${i} >> /etc/hosts; done'

          for i in {2..20}
          do
            sudo ip addr add "127.0.0.${i}" dev lo
            sudo route add -host "127.0.0.${i}" dev lo;
          done

          export JDK_VERSION="11"
          export SPARK_VERSION="3"
          export SCALA_VERSION="2.12"
          export CASSANDRA_USE_JDK11="true"

          ./scripts/build-dependencies.sh

          # `rat` is listed explicitly: codeCheckTasks only aggregates the subprojects'
          # Checkstyle tasks (its dependsOn(withType(RatTask)) sits inside subprojects {},
          # where no RatTask exists — :rat is a root-project task). It must run in a job
          # that has a checkout, because :buildIgnoreRatList shells out to `git clean -dxn`
          # to build the exclude list for generated files.
          ./gradlew --no-daemon --max-workers=2 codeCheckTasks rat
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-repo-jdk11-${{ github.sha }}
      - name: Cache workspace
        id: cache-build-save
        uses: actions/cache/save@v4
        with:
          path: analytics
          key: analytics-build-jdk11-${{ github.sha }}

  # JDK17 dependency build for the Spark 4 / Scala 2.13 / Cassandra 5.0 matrix.
  # Produces a distinct workspace cache (analytics-build-jdk17-...) so downstream test
  # jobs must restore from exactly one of build-jdk11 / build-jdk17 — mixing them
  # would clobber dependency jars.
  build-jdk17:
    name: Compile and build (JDK 17)
    needs: changes
    if: ${{ needs.changes.outputs.analytics == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - run: |
          sudo apt-get update

          if [ -f /etc/ssl/certs/java/cacerts/cacerts ]; then
              sudo mv /etc/ssl/certs/java/cacerts/ /etc/ssl/certs/java/cacerts-old
              sudo mv /etc/ssl/certs/java/cacerts-old/cacerts /etc/ssl/certs/java/
              sudo rmdir /etc/ssl/certs/java/cacerts-old
          fi

          apt-get download ant ant-optional
          sudo dpkg --force-all -i ant*.deb
          rm ant*.deb

          sudo bash -c 'for i in {2..20}; do echo 127.0.0.${i} localhost${i} >> /etc/hosts; done'

          for i in {2..20}
          do
            sudo ip addr add "127.0.0.${i}" dev lo
            sudo route add -host "127.0.0.${i}" dev lo;
          done

          export JDK_VERSION="17"
          export SPARK_VERSION="4"
          export SCALA_VERSION="2.13"
          # JDK17 only targets Cassandra 5.0+; skip 4.0 / 4.1 dtest jar builds
          # (build-dtest-jars.sh reads this var to filter CANDIDATE_BRANCHES).
          export BRANCHES="cassandra-5.0"

          ./scripts/build-dependencies.sh

          # See the JDK11 build for why `rat` is listed explicitly.
          ./gradlew codeCheckTasks rat
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-repo-jdk17-${{ github.sha }}
      - name: Cache workspace
        id: cache-build-save
        uses: actions/cache/save@v4
        with:
          path: analytics
          key: analytics-build-jdk17-${{ github.sha }}

  unit-test:
    name: Unit test - Scala ${{ matrix.scala }} ${{ matrix.sstable-format }} C${{ matrix.cassandra }} Spark${{ matrix.spark }} JDK${{ matrix.jdk }}
    # Each matrix entry only consumes one of these caches (selected by matrix.jdk),
    # but `needs:` cannot be matrix-conditional so we wait on both builds.
    needs: [changes, build-jdk11, build-jdk17]
    if: ${{ needs.changes.outputs.analytics == 'true' }}
    runs-on: ubuntu-latest
    # No checks: write. action-junit-report runs with annotate_only, which never touches
    # the check-runs API — see the "Publish test report" steps for why.
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - scala: '2.13'
            sstable-format: 'bti'
            cassandra: '5.0'
            jdk: '11'
            spark: '3'
          - scala: '2.12'
            sstable-format: 'big'
            cassandra: '4.1'
            jdk: '11'
            spark: '3'
          - scala: '2.12'
            sstable-format: 'big'
            cassandra: '4.0'
            jdk: '11'
            spark: '3'
          - scala: '2.13'
            sstable-format: 'bti'
            cassandra: '5.0'
            jdk: '17'
            spark: '4'
      fail-fast: false
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdk }}
      # No checkout: analytics/ is materialized by the workspace cache restore below.
      # This step is host setup only, so it must NOT inherit working-directory: analytics
      # (that dir does not exist yet and bash would fail to cd into it).
      - run: |
          sudo bash -c 'for i in {2..20}; do echo 127.0.0.${i} localhost${i} >> /etc/hosts; done'
          for i in {2..20}
          do
            sudo ip addr add "127.0.0.${i}" dev lo
            sudo route add -host "127.0.0.${i}" dev lo;
          done
        working-directory: .
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-repo-jdk${{ matrix.jdk }}-${{ github.sha }}
      - name: Cache workspace
        id: cache-build-restore
        uses: actions/cache/restore@v4
        with:
          path: analytics
          key: analytics-build-jdk${{ matrix.jdk }}-${{ github.sha }}
          # Without the cache there is no source tree at all; fail with that message
          # rather than a confusing "./gradlew: no such file" 20 lines later.
          fail-on-cache-miss: true
      - run: |
          export SPARK_VERSION="${{ matrix.spark }}"
          export SCALA_VERSION="${{ matrix.scala }}"
          export JDK_VERSION="${{ matrix.jdk }}"
          export INTEGRATION_MAX_PARALLEL_FORKS=1
          export INTEGRATION_MAX_HEAP_SIZE="3072M"
          export CASSANDRA_VERSION="${{ matrix.cassandra }}"
          if [ "${{ matrix.jdk }}" = "11" ]; then
            export CASSANDRA_USE_JDK11=true
          fi

          # -x rat: this job has no checkout, so :buildIgnoreRatList's `git clean -dxn`
          # fails and rat then audits generated files (cassandra-analytics-build.properties,
          # scripts/dependency-reduced-pom.xml) that git would have excluded. The build
          # jobs run :rat against a real checkout instead.
          ./gradlew --stacktrace clean assemble check -x rat -x cassandra-analytics-integration-tests:test -Dcassandra.analytics.bridges.sstable_format=${{ matrix.sstable-format }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-s${{ matrix.scala }}-${{ matrix.sstable-format }}-C${{ matrix.cassandra }}-Spark${{ matrix.spark }}-JDK${{ matrix.jdk }}
          path: |
            analytics/build/test-results/**
            analytics/build/reports/tests/**
          retention-days: 30
      # Renders the JUnit XML as a pass/fail table in the job summary and annotates
      # failing tests inline. Without this, GitHub only shows job-level red/green and
      # the results are only readable by downloading the artifact above.
      # check_name must be unique per matrix leg or the legs overwrite each other's
      # check run. fail_on_failure is left at its default (false): gradle has already
      # failed the job, and re-failing here would mask its exit status.
      #
      # annotate_only skips the check-runs API and emits ::error log commands instead.
      # On a PR from a fork the GITHUB_TOKEN is read-only no matter what `permissions:`
      # says, so creating a check run 403s — which is how this step used to fail on
      # every contributor PR. Log-command annotations need no token at all.
      # skip_success_summary keeps green legs out of the run summary so the aggregate
      # in the test-report job stays readable.
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'analytics/build/test-results/**/*.xml'
          check_name: 'Unit tests s${{ matrix.scala }}-${{ matrix.sstable-format }}-C${{ matrix.cassandra }}-Spark${{ matrix.spark }}-JDK${{ matrix.jdk }}'
          detailed_summary: true
          include_time_in_summary: true
          # Some legs legitimately run zero tests (see the C4.0 exclusions below), so a
          # missing/empty report must not fail the job — the totals in the table make
          # "nothing ran" visible without turning it into a hard error.
          require_tests: false
          annotate_only: true
          skip_success_summary: true

  integration-test:
    name: Integration test - ${{ matrix.config }} (${{ matrix.job_index }})
    # Each matrix entry only consumes one of these caches (selected by matrix.jdk),
    # but `needs:` cannot be matrix-conditional so we wait on both builds.
    needs: [changes, build-jdk11, build-jdk17]
    if: ${{ needs.changes.outputs.analytics == 'true' }}
    runs-on: ubuntu-latest
    # No checks: write. action-junit-report runs with annotate_only, which never touches
    # the check-runs API — see the "Publish test report" steps for why.
    permissions:
      contents: read
    strategy:
      # GitHub Actions generate a cross-product of 'config' × 'job_index' (4 × 5 = 20 jobs).
      # The 'include' entries don't add new combinations — they augment existing ones
      # by matching on 'config' and injecting 'scala', 'cassandra', 'jdk', and 'spark'
      # into each match. To add a new version: add one entry to 'config' and one to
      # 'include'.
      matrix:
        config: ['s2.13-c5.0.5', 's2.12-c4.1.4', 's2.12-c4.0.17', 's2.13-c5.0.5-spark4']
        job_index: [0, 1, 2, 3, 4]
        job_total: [5]
        include:
          - config: 's2.13-c5.0.5'
            scala: '2.13'
            cassandra: '5.0.5'
            jdk: '11'
            spark: '3'
          - config: 's2.12-c4.1.4'
            scala: '2.12'
            cassandra: '4.1.4'
            jdk: '11'
            spark: '3'
          - config: 's2.12-c4.0.17'
            scala: '2.12'
            cassandra: '4.0.17'
            jdk: '11'
            spark: '3'
          - config: 's2.13-c5.0.5-spark4'
            scala: '2.13'
            cassandra: '5.0.5'
            jdk: '17'
            spark: '4'
      fail-fast: false
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdk }}
      # No checkout: analytics/ is materialized by the workspace cache restore below.
      # This step is host setup only, so it must NOT inherit working-directory: analytics
      # (that dir does not exist yet and bash would fail to cd into it).
      - run: |
          sudo bash -c 'for i in {2..20}; do echo 127.0.0.${i} localhost${i} >> /etc/hosts; done'
          for i in {2..20}
          do
            sudo ip addr add "127.0.0.${i}" dev lo
            sudo route add -host "127.0.0.${i}" dev lo;
          done
        working-directory: .
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-repo-jdk${{ matrix.jdk }}-${{ github.sha }}
      - name: Cache workspace
        id: cache-build-restore
        uses: actions/cache/restore@v4
        with:
          path: analytics
          key: analytics-build-jdk${{ matrix.jdk }}-${{ github.sha }}
          # Without the cache there is no source tree at all; fail with that message
          # rather than a confusing "./gradlew: no such file" 20 lines later.
          fail-on-cache-miss: true
      - run: |
          export SPARK_VERSION="${{ matrix.spark }}"
          export SCALA_VERSION="${{ matrix.scala }}"
          export JDK_VERSION="${{ matrix.jdk }}"
          export INTEGRATION_MAX_PARALLEL_FORKS=1
          export INTEGRATION_MAX_HEAP_SIZE="3072M"
          if [ "${{ matrix.jdk }}" = "11" ]; then
            export CASSANDRA_USE_JDK11=true
          fi

          export DTEST_JAR="dtest-${{ matrix.cassandra }}.jar"
          export CASSANDRA_VERSION=$(echo ${{ matrix.cassandra }} | cut -d'.' -f 1,2)

          ./gradlew --stacktrace clean assemble

          cd cassandra-analytics-integration-tests/src/test/java
          # Shuffle test classes using the commit SHA as seed for reproducible randomization,
          # then shard across runners via round-robin on the shuffled order.
          CLASSNAMES=$(find . -name '*Test.java' | cut -c 3- | sed 's@/@.@g' | sed 's/.\{5\}$//' \
            | python3 -c "import random,sys; lines=sys.stdin.read().splitlines(); random.seed('$GITHUB_SHA'); random.shuffle(lines); print('\n'.join(lines))" \
            | awk 'NR % ${{ matrix.job_total }} == ${{ matrix.job_index }}')
          cd ../../../..

          EXIT_STATUS=0
          # Execution of "gradle test --test $TEST_NAME" returns non-zero exit code when commend did not run any test
          # (e.g. when all tests are ignored). Currently there is no option to change Gradle behaviour.
          # Workaround the issue by explicitly skipping test classes that cannot be executed on Cassandra 4.0.
          C40_EXCLUSIONS=("org.apache.cassandra.analytics.BulkWriteDownInstanceMultipleTokensTest" "org.apache.cassandra.analytics.BulkWriteDownSidecarMultipleTokensTest" "org.apache.cassandra.analytics.CassandraAnalyticsSimpleMultipleTokensTest" "org.apache.cassandra.analytics.RandomPartitionerTest" "org.apache.cassandra.analytics.testcontainer.BulkWriteS3CompatModeSimpleMultipleTokensTest" "org.apache.cassandra.analytics.data.ClearSnapshotTest")
          for TEST_NAME in $CLASSNAMES; do
            SKIP="false"
            for C40_EXCLUSION in "${C40_EXCLUSIONS[@]}";
            do
              if [[ "$CASSANDRA_VERSION" == "4.0" && "$TEST_NAME" == ${C40_EXCLUSION} ]]; then
                SKIP="true"
                break
              fi
            done

            test_id=$(date +%H%M%S)
            mkdir -p "test-reports/$test_id/html"

            if [ $SKIP == "false" ]; then
              echo Executing test $TEST_NAME
              ./gradlew --stacktrace cassandra-analytics-integration-tests:test --tests $TEST_NAME --no-daemon || EXIT_STATUS=$?;
              find build/test-results -name "*.xml" -exec cp {} "test-reports/$test_id/" \; 2>/dev/null || true
              [ -d "build/reports/tests" ] && cp -r build/reports/tests/. "test-reports/$test_id/html/" 2>/dev/null || true
            else
              echo "Skipping test $TEST_NAME"
            fi
          done;

          exit $EXIT_STATUS
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ matrix.config }}-${{ matrix.job_index }}
          path: analytics/test-reports/
          retention-days: 30
      # MUST read the test-reports/ copies, not gradle's build/test-results/. The shard
      # loop invokes gradle once per test class, and gradle deletes a test task's output
      # dir before re-running it, so build/test-results/ holds only the LAST class of the
      # shard — a leg that failed on class 6 of 11 reported "2 tests, 2 passed" from
      # class 11 and looked green. The per-class copies do not double-count for the same
      # reason: each `find` after a gradle run sees only that run's XML.
      # See the unit-test job for why check_name is per-leg and require_tests is false.
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'analytics/test-reports/**/*.xml'
          check_name: 'Integration tests ${{ matrix.config }} (${{ matrix.job_index }})'
          detailed_summary: true
          include_time_in_summary: true
          require_tests: false
          annotate_only: true
          skip_success_summary: true

  # Single top-level failure dashboard for the whole run: one table listing every
  # failing suite:test with a one-line failure detail, instead of 24 job summaries and
  # a wall of PASSED log lines to click through.
  #
  # This is a job summary, not a check run — job summaries are written to a local file
  # ($GITHUB_STEP_SUMMARY) and so render identically on fork PRs, where GITHUB_TOKEN is
  # read-only and the check-runs API is unavailable.
  #
  # This is NOT a merge gate: it must never be a required status check (see the header
  # comment). fail_on_failure stays at its default (false) so this job goes green even
  # when it is reporting failures — the individual test jobs are what turn the run red.
  test-report:
    name: Test report
    needs: [changes, unit-test, integration-test]
    # always() so the report is produced when the test jobs fail — which is the only
    # time anyone reads it. Still gated on the changes filter: with analytics untouched
    # the test jobs are skipped and there are no artifacts to aggregate.
    if: ${{ always() && needs.changes.outputs.analytics == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Matches unit-test-results-* and integration-test-results-*. No merge-multiple:
      # every leg's XML would land in one flat dir and same-named files (TEST-<class>.xml
      # for a class sharded across configs) would clobber each other.
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: '*results*'
          path: test-results
      - name: Aggregate test report
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'test-results/**/*.xml'
          detailed_summary: true
          include_time_in_summary: true
          # A leg that died before writing any XML leaves nothing to aggregate; the run
          # is already red from that job, so do not compound it with a second failure.
          require_tests: false
          annotate_only: true
          # Unlike the per-leg steps this one always renders: on a fully green run the
          # totals row is the "5000 passed, 0 failed" confirmation.
          skip_success_summary: false
