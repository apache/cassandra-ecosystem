# Merged .asf.yaml for cassandra-ecosystem. Reconciles the analytics and sidecar
# .asf.yaml files per the CEP-63 working-group decisions. Only ONE .asf.yaml is read
# by ASF infra (repo root); the copies under analytics/ and sidecar/ are inert.

github:
  # A neutral, purpose-stating description (CEP-63 §1 junk-drawer guardrail — the
  # inclusion criteria live in README.md; adding a new top-level project requires a
  # dev@ lazy-consensus discussion).
  description: "Apache Cassandra ecosystem: co-located companion projects (Analytics + Sidecar) for Apache Cassandra®"
  homepage: https://cassandra.apache.org/

  enabled_merge_buttons:
    squash: true
    merge:  false
    rebase: true   # analytics allowed rebase; carried forward per decision

  features:
    wiki: false
    issues: false
    projects: false

  # Keep the CASSANALYTICS and CASSSIDECAR Jira projects split (CEP-63); CASSANDRASC
  # is the old sidecar key, CASSANDRA the server project.
  autolink_jira:
    - CASSANALYTICS
    - CASSSIDECAR
    - CASSANDRASC
    - CASSANDRA

  # Converge on rulesets (analytics' mechanism).
  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      # No required_status_checks, matching upstream cassandra-analytics (which declared
      # none) and cassandra-sidecar (which set only strict: true with no contexts).
      # Merge readiness is a committer judgement call made by reading the checks list on
      # the PR — there is deliberately no programmatic forcing function.
      #
      # If required contexts are ever wanted: do NOT list the per-project heavy jobs.
      # They are path-skipped on single-project PRs, and a skipped required context sits
      # at "Expected — waiting for status" forever. That needs an always-running
      # aggregator job, which is what was removed here.
      #
      # The "Test report" job in each CI workflow is NOT that aggregator. It only renders
      # the failing-test dashboard into the run summary, and it carries the same
      # path-skip condition as the test jobs, so making it required would hang exactly
      # as described above.

notifications:
  commits:      commits@cassandra.apache.org
  issues:       commits@cassandra.apache.org
  pullrequests: pr@cassandra.apache.org   # sidecar routed PRs to pr@; carried forward
  jira_options: link worklog
